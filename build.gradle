// Multi-version preprocessor root build script.
// Reference: Slideshow-Pro (ReplayMod/Fallen-Breath preprocessor workflow).

plugins {
	id 'fabric-loom' version '1.16-SNAPSHOT' apply false
	id 'net.fabricmc.fabric-loom-remap' version '1.16-SNAPSHOT' apply false

	// https://github.com/ReplayMod/preprocessor (upstream; supports extra-mappings files via link())
	id 'com.replaymod.preprocess-root' version '221276c7d4'
	id 'com.replaymod.preprocess' version '221276c7d4' apply false
}

preprocess {
	// Fail the build when a mapping-file entry matches nothing (catches typos)
	strictExtraMappings = true

	// The main (core) project is read from versions/mainProject by the plugin itself.

	// mappings arg: non-null = obfuscated (joined via intermediary/mojmap),
	// null = unobfuscated (26.x ships official names; those links join by
	// shared mojang names instead).
	def mc1201  = createNode('1.20.1', 1_20_01, 'mojang')
	def mc1211  = createNode('1.21.1', 1_21_01, 'mojang')
	def mc1219  = createNode('1.21.9', 1_21_09, 'mojang')
	def mc260102 = createNode('26.1.2', 26_01_02, null)
	def mc260200 = createNode('26.2', 26_02_00, null)

	// Node coverage (per-version APIs verified via mappings.dev + authlib versions):
	//   1.21.1 covers 1.21-1.21.8 (User ctor+Type, setFormatter, authenticateServer unchanged)
	//   1.21.9 covers 1.21.9-1.21.11 (User 5-arg, addFormatter, MouseButtonEvent started at 1.21.9)
	mc1201.link(mc1211, file('versions/mapping-1.20.1-1.21.1.txt'))
	mc1211.link(mc1219, file('versions/mapping-1.21.1-1.21.9.txt'))
	mc1219.link(mc260102, file('versions/mapping-1.21.9-26.1.2.txt'))
	mc260102.link(mc260200, file('versions/mapping-26.1.2-26.2.txt'))
}

tasks.register('buildAndGather') {
	subprojects {
		dependsOn project.tasks.named('build').get()
	}
	doFirst {
		println 'Gathering builds'
		def buildLibs = {
			p -> p.buildDir.toPath().resolve('libs')
		}
		delete fileTree(buildLibs(rootProject)) {
			include '*'
		}
		subprojects {
			copy {
				from(buildLibs(project)) {
					include '*.jar'
					exclude '*-dev.jar', '*-sources.jar', '*-shadow.jar'
				}
				into buildLibs(rootProject)
				duplicatesStrategy = DuplicatesStrategy.INCLUDE
			}
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs << '-Xlint:-processing'
}
